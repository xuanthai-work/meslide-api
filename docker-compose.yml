x-api-environment: &api-environment
  - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
  - APP_DATA_DIRECTORY=/app_data
  - TEMP_DIRECTORY=/tmp/gslide
  - USER_CONFIG_PATH=/app_data/userConfig.json
  - GSLIDE_HOST_HTTP_PORT=${GSLIDE_WEB_HOST_PORT:-${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-3000}}}
  - GSLIDE_HTTP_HOST_PORT=${GSLIDE_WEB_HOST_PORT:-${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-3000}}}
  - MIGRATE_DATABASE_ON_STARTUP=true
  - NEXT_PUBLIC_URL=http://localhost:${GSLIDE_WEB_HOST_PORT:-${GSLIDE_HTTP_HOST_PORT:-${PRESENTON_HTTP_HOST_PORT:-3000}}}
  - EXPORT_PAGE_BASE_URL=${EXPORT_PAGE_BASE_URL:-http://web:3000}
  - LLM=${LLM:-}
  - OPENAI_API_KEY=${OPENAI_API_KEY:-}
  - OPENAI_MODEL=${OPENAI_MODEL:-}
  - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
  - GOOGLE_MODEL=${GOOGLE_MODEL:-}
  - CUSTOM_LLM_URL=${CUSTOM_LLM_URL:-}
  - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
  - CUSTOM_MODEL=${CUSTOM_MODEL:-}
  - DISABLE_IMAGE_GENERATION=${DISABLE_IMAGE_GENERATION:-}
  - ENABLE_PARALLEL_IMAGE_GENERATION=${ENABLE_PARALLEL_IMAGE_GENERATION:-true}
  - IMAGE_PROVIDER=${IMAGE_PROVIDER:-}
  - GPT_IMAGE_1_5_QUALITY=${GPT_IMAGE_1_5_QUALITY:-}
  - EXTENDED_REASONING=${EXTENDED_REASONING:-}
  - DISABLE_THINKING=${DISABLE_THINKING:-}
  - WEB_GROUNDING=${WEB_GROUNDING:-}
  - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-auto}
  - WEB_SEARCH_MAX_RESULTS=${WEB_SEARCH_MAX_RESULTS:-}
  - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
  - WEB_IMAGE_SEARCH_ENABLED=${WEB_IMAGE_SEARCH_ENABLED:-false}
  - WEB_IMAGE_SEARCH_MAX_RESULTS=${WEB_IMAGE_SEARCH_MAX_RESULTS:-}
  - DATABASE_URL=${DATABASE_URL:-}
  - MEM0_LLM_MODEL=${MEM0_LLM_MODEL:-}
  - MEM0_LLM_API_KEY=${MEM0_LLM_API_KEY:-}
  - MEM0_LLM_BASE_URL=${MEM0_LLM_BASE_URL:-}
  - MEM0_ENABLED=${MEM0_ENABLED:-false}
  - MEM0_DIR=${MEM0_DIR:-/app_data/mem0}
  - MEM0_EMBEDDER_PROVIDER=${MEM0_EMBEDDER_PROVIDER:-fastembed}
  - MEM0_EMBEDDER_MODEL=${MEM0_EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
  - MEM0_EMBEDDING_DIMS=${MEM0_EMBEDDING_DIMS:-384}
  - MEM0_SPACY_MODEL=${MEM0_SPACY_MODEL:-en_core_web_sm}
  - MEM0_REQUIRE_SPACY_MODEL=${MEM0_REQUIRE_SPACY_MODEL:-true}
  - LITEPARSE_DPI=${LITEPARSE_DPI:-120}
  - LITEPARSE_NUM_WORKERS=${LITEPARSE_NUM_WORKERS:-1}
  - OPENAI_COMPAT_IMAGE_BASE_URL=${OPENAI_COMPAT_IMAGE_BASE_URL:-}
  - OPENAI_COMPAT_IMAGE_API_KEY=${OPENAI_COMPAT_IMAGE_API_KEY:-}
  - OPENAI_COMPAT_IMAGE_MODEL=${OPENAI_COMPAT_IMAGE_MODEL:-}
  - AUTH_USERNAME=${AUTH_USERNAME:-}
  - AUTH_PASSWORD=${AUTH_PASSWORD:-}
  - AUTH_OVERRIDE_FROM_ENV=${AUTH_OVERRIDE_FROM_ENV:-}
  - RESET_AUTH=${RESET_AUTH:-}
  - OBJECT_STORAGE_BACKEND=${OBJECT_STORAGE_BACKEND:-local}
  - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
  - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
  - S3_SECRET_KEY=${S3_SECRET_KEY:-}
  - S3_BUCKET=${S3_BUCKET:-gslide}
  - S3_REGION=${S3_REGION:-us-east-1}
  - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
  - S3_CONNECT_TIMEOUT_SECONDS=${S3_CONNECT_TIMEOUT_SECONDS:-5}
  - S3_READ_TIMEOUT_SECONDS=${S3_READ_TIMEOUT_SECONDS:-30}

x-api-healthcheck: &api-healthcheck
  test:
    - CMD
    - curl
    - -fsS
    - http://127.0.0.1:8000/api/v1/auth/status
  interval: 30s
  timeout: 3s
  retries: 30
  start_period: 10s

# Shared with gslide-web (same explicit network/volume names) so the two
# Compose projects can run from separate GitLab checkouts.
networks:
  gslide:
    name: gslide

volumes:
  gslide_app_data:
    name: gslide_app_data
  gslide_api_node_modules:
  gslide_document_extraction_liteparse:

services:
  api:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${GSLIDE_API_HOST_PORT:-8000}:8000"
    volumes:
      - gslide_app_data:/app_data
      - ./servers/fastapi/templates:/app/servers/fastapi/templates:ro
    environment: *api-environment
    healthcheck: *api-healthcheck
    networks:
      gslide:
        aliases:
          - api

  api-dev:
    platform: ${GSLIDE_DOCKER_PLATFORM:-${PRESENTON_DOCKER_PLATFORM:-linux/amd64}}
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${GSLIDE_API_HOST_PORT:-8000}:8000"
    volumes:
      - .:/app
      - gslide_api_node_modules:/app/node_modules
      - gslide_document_extraction_liteparse:/app/document-extraction-liteparse
      - gslide_app_data:/app_data
    environment: *api-environment
    healthcheck: *api-healthcheck
    networks:
      gslide:
        aliases:
          - api
