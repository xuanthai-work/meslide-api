# Repository job: npm test + Dockerfile/export contracts.
# FastAPI job: keep steps aligned with root `npm run check:fastapi`
# (ruff, pyright, vulture, deptry, tests/run_suite.py).
name: Test api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-repository-tools:
    name: Test repository tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run Dockerfile and CI contract tests
        run: node --test tests/*.test.mjs

      - name: Install presentation export runtime
        run: npm run sync:presentation-export

      - name: Verify presentation export runtime
        run: npm run check:presentation-export

  test-fastapi:
    name: Test FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/fastapi
    env:
      # APP_DATA_DIRECTORY / TEMP_DIRECTORY / DATABASE_URL isolation is owned
      # by tests/run_suite.py (same as local `npm run test:fastapi`).
      DISABLE_IMAGE_GENERATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run Pyright
        run: uv run --locked pyright

      - name: Check for dead code
        run: uv run --locked vulture

      - name: Check dependency declarations
        run: uv run --locked deptry .

      - name: Run all pytest tests
        run: uv run --locked python tests/run_suite.py --verbose --tb=short
