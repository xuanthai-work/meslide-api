# TEMPLATE — never commit a populated Secret. Use the platform's external
# secrets solution (Sealed Secrets, External Secrets, Vault, cloud SM, etc.)
# and bind it to `gslide-secrets`. The values below are empty placeholders.
#
# Required keys depend on the configured LLM/image provider. Leave unused
# keys empty.
apiVersion: v1
kind: Secret
metadata:
  name: gslide-secrets
  namespace: gslide
  labels:
    app.kubernetes.io/part-of: gslide
type: Opaque
stringData:
  # LLM provider keys
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
  CUSTOM_LLM_API_KEY: ""
  OPENAI_COMPAT_IMAGE_API_KEY: ""
  OPENAI_COMPAT_IMAGE_BASE_URL: ""
  OPENAI_COMPAT_IMAGE_MODEL: ""
  # Mem0 (presentation memory) — points at an OpenAI-compatible endpoint
  MEM0_LLM_API_KEY: ""
  MEM0_LLM_BASE_URL: ""
  MEM0_LLM_MODEL: ""
  # Optional: seed the first user on boot (password >= 8 chars)
  AUTH_USERNAME: ""
  AUTH_PASSWORD: ""
  # Database URL. Leave empty for SQLite under /app_data. PostgreSQL is needed
  # before scaling the API beyond one replica.
  DATABASE_URL: ""
