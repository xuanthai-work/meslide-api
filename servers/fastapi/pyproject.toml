[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gslide-backend"
version = "0.1.0"
description = "Add your description here"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14.0",
    "aiohttp>=3.12.15",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "cryptography>=46.0.0",
    "dirtyjson>=1.0.8",
    "fastapi[standard]>=0.116.1",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "fastembed-vectorstore>=0.5.2",
    "greenlet>=3.0.3",
    "google-genai>=1.28.0",
    "httpx>=0.28.0",
    "mem0ai[nlp]>=0.1.115",
    "nltk>=3.9.1",
    "openai>=1.98.0",
    "pathvalidate>=3.3.1",
    "pdfplumber>=0.11.7",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.24",
    "jsonschema>=4.26.0",
    "python-pptx>=1.0.2",
    "fonttools>=4.55.0",
    "boto3>=1.40.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "enums*",
    "models*",
    "services*",
    "constants*",
    "utils*",
    "templates*",
]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Expand this list package-by-package as the existing typing baseline is fixed.
include = [
    "services/image_search",
    "utils/datetime_utils.py",
    "utils/filename_utils.py",
    "utils/outline_limits.py",
]
exclude = [
    ".venv",
    "alembic/versions",
]

[tool.ruff]
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# Start with correctness-focused Pyflakes rules. Add import/style rules only in
# dedicated cleanup PRs so this guardrail stays actionable.
select = ["F"]

[tool.vulture]
# Scan runtime packages only. Alembic versions are generated; do not add
# broad ignore_names to silence unused application symbols.
paths = [
    "api",
    "constants",
    "enums",
    "models",
    "services",
    "templates",
    "utils",
    "server.py",
    "migrations.py",
]
exclude = ["alembic/versions/"]
min_confidence = 80
sort_by_size = true

[tool.deptry]
# Direct imports supplied by framework extras are existing packaging debt. Keep
# unused-dependency detection active while that debt is handled separately.
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
# Loaded through URL schemes or plugin discovery rather than direct imports.
# New entries need an owner comment. Do not grow this list to hide unused
# packages that application code no longer needs.
DEP002 = [
    "aiomysql",      # SQLAlchemy MySQL async driver (DATABASE_URL)
    "aiosqlite",     # SQLAlchemy SQLite async driver (default local DB)
    "asyncpg",       # SQLAlchemy PostgreSQL async driver (DATABASE_URL)
    "cryptography",  # SQLAlchemy/password hashing extra
    "greenlet",      # SQLAlchemy async greenlet runtime
    "nltk",          # Mem0/NLP tokenizer loaded by provider stack
    "psycopg",       # SQLAlchemy PostgreSQL sync driver (migrations/tools)
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pyright>=1.1.413",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Line coverage defaults (omit non-runtime / generated paths). Branch coverage doubles
# the work for marginal signal; optimize for deterministic statement coverage runs.
[tool.coverage.run]
branch = false
relative_files = true
source = ["."]
omit = [
    "tests/*",
    "**/.venv/*",
    "**/venv/*",
    "alembic/versions/*",
    "scripts/*",
]

[tool.coverage.report]
precision = 1
skip_empty = true
show_missing = true
